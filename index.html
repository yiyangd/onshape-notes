<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose an Onshape project and follow its animated modeling tutorial in English, with optional Chinese translations.">
  <title>Projects | Onshape Notes</title>
  <link rel="stylesheet" href="language.css">
  <script defer src="language.js"></script>
  <script>
    function openLegacyPyramidStep() {
      if (/^#step-(0[1-9]|1[0-2])$/.test(location.hash)) {
        location.replace('pyramid/' + location.search + location.hash);
      }
    }
    openLegacyPyramidStep();
    window.addEventListener('hashchange', openLegacyPyramidStep);
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      color: #18363a;
      background: #f4f7f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .wrap { width: min(100% - 2.5rem, 63rem); margin-inline: auto; }
    .mast { padding-block: 1.15rem; border-bottom: 1px solid #cbd9d5; background: #fff; }
    .mast-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem 1.25rem; }
    .brand { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -.025em; }
    .mast-nav { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .8rem; }
    .toolkit { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: .5rem .95rem; border-radius: .45rem; background: #125e58; color: #fff; text-decoration: none; font-size: .95rem; font-weight: 600; }
    .toolkit .zh { color: inherit; }
    .toolkit:hover { background: #0b4946; }
    .toolkit:focus-visible { outline: 3px solid #167671; outline-offset: 3px; }
    main { padding-block: clamp(2rem, 6vw, 4.5rem); }
    h1 { margin: 0 0 clamp(1.4rem, 3vw, 2.1rem); font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -.045em; line-height: 1.1; }
    h1 .zh { margin-top: .12em; color: #536c6e; font-size: .54em; letter-spacing: 0; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(1rem, 2.7vw, 1.75rem); }
    .project { min-width: 0; display: block; border: 1px solid #c6d5d1; border-radius: .65rem; overflow: hidden; background: #fff; color: inherit; text-decoration: none; }
    .project:hover, .project:focus-visible { border-color: #28726c; }
    .project:hover h2, .project:focus-visible h2 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .15em; }
    .project:focus-visible { outline: 3px solid #167671; outline-offset: 4px; }
    .project img { display: block; width: 100%; height: auto; }
    .card-copy { padding: 1.2rem clamp(1.15rem, 2.5vw, 1.6rem) 1.35rem; border-top: 1px solid #e1e9e5; }
    h2 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.8rem); line-height: 1.3; letter-spacing: -.03em; }
    h2 .zh { margin-top: .15em; font-size: .77em; font-weight: 600; letter-spacing: 0; }
    .skills { margin: .55rem 0 .18rem; color: #345a5c; font-size: 1rem; line-height: 1.5; }
    .steps { margin: .65rem 0 0; color: #526b6e; font-size: .9rem; }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 2rem, 28rem); }
      .projects { grid-template-columns: 1fr; }
      .card-copy { padding: 1rem 1.15rem 1.2rem; }
    }
  </style>
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <p class="brand">Onshape Notes</p>
      <nav class="mast-nav" aria-label="Site navigation">
        <a class="toolkit" href="student-toolkit/">Student Toolkit<span class="zh" lang="zh-CN">学生工具包</span></a>
        <button id="bilingual-toggle" type="button" aria-pressed="false" hidden><span class="track" aria-hidden="true"></span><span>Bilingual · <span lang="zh-CN">双语</span></span></button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Projects<span class="zh" lang="zh-CN">项目目录</span></h1>
    <nav class="projects" aria-label="Choose a project">
      <a class="project" href="pyramid/">
        <img src="previews/pyramid.webp" width="640" height="350" alt="">
        <div class="card-copy">
          <h2>Pyramid<span class="zh" lang="zh-CN">四棱锥</span></h2>
          <p class="skills">Loft<span class="zh" lang="zh-CN">放样</span></p>
          <p class="steps">12 steps<span class="zh" lang="zh-CN">12 步</span></p>
        </div>
      </a>
      <a class="project" href="traffic-cone/">
        <img src="previews/traffic-cone.webp" width="640" height="350" alt="">
        <div class="card-copy">
          <h2>Traffic Cone<span class="zh" lang="zh-CN">交通锥</span></h2>
          <p class="skills">Loft, Shell, Revolve<span class="zh" lang="zh-CN">放样、抽壳、旋转</span></p>
          <p class="steps">56 steps<span class="zh" lang="zh-CN">56 步</span></p>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
